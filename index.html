<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>霓虹闪避 - Neon Dodge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; /* 深蓝背景 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* 防止手机端下拉刷新 */
        }
        canvas {
            display: block;
        }
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }
        .btn {
            pointer-events: auto;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
            border: none;
            padding: 12px 36px;
            font-size: 24px;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
            transition: transform 0.1s, box-shadow 0.1s;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 5;
        }
        .hidden {
            display: none !important;
        }
        /* 简单的动画效果 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .title {
            font-size: 4rem;
            font-weight: 900;
            background: -webkit-linear-gradient(45deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            animation: pulse 2s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <!-- 分数显示 -->
    <div class="hud">
        <div>分数: <span id="scoreEl">0</span></div>
        <div class="text-sm text-gray-400 mt-1">最高分: <span id="highScoreEl">0</span></div>
    </div>

    <!-- 游戏开始/结束 界面 -->
    <div id="startScreen" class="ui-overlay">
        <h1 class="title">NEON DODGE</h1>
        <p class="text-gray-300 mb-8 text-lg">移动鼠标或手指躲避红色方块<br>收集黄色星星加分</p>
        <button class="btn" id="startBtn">开始游戏</button>
    </div>

    <div id="gameOverScreen" class="ui-overlay hidden">
        <h1 class="text-5xl font-bold text-white mb-2">游戏结束</h1>
        <p class="text-2xl text-blue-400 mb-8 font-bold">最终得分: <span id="finalScoreEl">0</span></p>
        <button class="btn" id="restartBtn">再玩一次</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreEl');
        const finalScoreEl = document.getElementById('finalScoreEl');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const highScoreEl = document.getElementById('highScoreEl');

        // 游戏状态
        let isPlaying = false;
        let score = 0;
        let highScore = localStorage.getItem('neon_dodge_highscore') || 0;
        let animationId;
        let frameCount = 0;
        let difficultyMultiplier = 1;

        highScoreEl.innerText = highScore;

        // 设置画布大小
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 玩家对象
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 15,
            color: '#60a5fa', // 亮蓝色
            trail: []
        };

        // 数组存储游戏元素
        let enemies = [];
        let particles = [];
        let stars = []; // 背景星星
        let coins = [];

        // 鼠标/触摸位置
        const mouse = { x: canvas.width / 2, y: canvas.height / 2 };

        // 监听输入
        window.addEventListener('mousemove', (e) => {
            if(isPlaying) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if(isPlaying) {
                e.preventDefault();
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        }, { passive: false });
        
        // 处理点击/触摸开始来同步初始位置
        const updateInputStart = (x, y) => {
             mouse.x = x;
             mouse.y = y;
        }
        
        window.addEventListener('mousedown', (e) => updateInputStart(e.clientX, e.clientY));
        window.addEventListener('touchstart', (e) => updateInputStart(e.touches[0].clientX, e.touches[0].clientY));


        // 类定义
        class Enemy {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = -30;
                this.size = Math.random() * 20 + 20; // 20-40px
                this.color = `hsl(${Math.random() * 30 + 340}, 80%, 60%)`; // 红色系
                // 速度随分数增加
                this.speed = (Math.random() * 2 + 2) + (score * 0.005); 
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.1;
            }

            update() {
                this.y += this.speed;
                this.angle += this.spin;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        class Coin {
            constructor() {
                this.x = Math.random() * (canvas.width - 40) + 20;
                this.y = -30;
                this.radius = 8;
                this.speed = 3;
                this.color = '#facc15'; // 黄色
            }
            update() {
                this.y += this.speed;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.closePath();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 3;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 4;
                this.dx = Math.cos(angle) * velocity;
                this.dy = Math.sin(angle) * velocity;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
            }

            update() {
                this.x += this.dx;
                this.y += this.dy;
                this.alpha -= this.decay;
                this.dx *= 0.98; // 摩擦力
                this.dy *= 0.98;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 1.5;
                this.alpha = Math.random();
                this.speed = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.y += this.speed;
                if(this.y > canvas.height) {
                    this.y = 0;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fill();
            }
        }

        // 初始化背景星星
        function initStars() {
            stars = [];
            for(let i=0; i<50; i++) {
                stars.push(new Star());
            }
        }

        // 核心游戏逻辑
        function spawnEnemies() {
            // 生成敌人的间隔随分数变短
            let interval = 40 - Math.floor(score / 50); 
            if(interval < 10) interval = 10;

            if (frameCount % interval === 0) {
                enemies.push(new Enemy());
            }
        }

        function spawnCoins() {
            if (frameCount % 100 === 0) {
                coins.push(new Coin());
            }
        }

        function createExplosion(x, y, color) {
            for(let i=0; i<15; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function checkCollision() {
            // 敌人检测
            enemies.forEach((enemy, index) => {
                const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                
                // 简单的矩形/圆形碰撞近似
                if (dist - enemy.size/2 - player.radius < 0) {
                    gameOver();
                }
            });

            // 金币检测
            coins.forEach((coin, index) => {
                const dist = Math.hypot(player.x - coin.x, player.y - coin.y);
                if (dist - coin.radius - player.radius < 0) {
                    // 吃金币
                    score += 10;
                    scoreEl.innerText = score;
                    createExplosion(coin.x, coin.y, '#facc15');
                    coins.splice(index, 1);
                }
            });
        }

        function drawPlayer() {
            // 平滑移动到鼠标位置
            const dx = mouse.x - player.x;
            const dy = mouse.y - player.y;
            player.x += dx * 0.1; // 延迟跟随效果
            player.y += dy * 0.1;

            // 绘制拖尾
            player.trail.push({x: player.x, y: player.y});
            if(player.trail.length > 10) player.trail.shift();

            ctx.beginPath();
            for(let i=0; i<player.trail.length; i++) {
                const point = player.trail[i];
                const radius = player.radius * (i / player.trail.length);
                ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
            }
            ctx.fillStyle = `rgba(96, 165, 250, 0.3)`;
            ctx.fill();

            // 绘制核心
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#60a5fa';
            ctx.fill();
            ctx.shadowBlur = 0; // 重置
        }

        function animate() {
            if (!isPlaying) return;

            animationId = requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frameCount++;
            
            // 缓慢增加分数（存活分）
            if(frameCount % 60 === 0) {
                score++;
                scoreEl.innerText = score;
            }

            // 更新背景
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            drawPlayer();
            spawnEnemies();
            spawnCoins();

            // 更新敌人
            enemies.forEach((enemy, index) => {
                enemy.update();
                enemy.draw();
                // 移除屏幕外的
                if (enemy.y > canvas.height + 50) {
                    enemies.splice(index, 1);
                }
            });

            // 更新金币
            coins.forEach((coin, index) => {
                coin.update();
                coin.draw();
                if (coin.y > canvas.height + 20) {
                    coins.splice(index, 1);
                }
            });

            // 更新粒子
            particles.forEach((particle, index) => {
                particle.update();
                particle.draw();
                if (particle.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });

            checkCollision();
        }

        function startGame() {
            score = 0;
            frameCount = 0;
            enemies = [];
            particles = [];
            coins = [];
            player.trail = [];
            scoreEl.innerText = "0";
            
            // 重置玩家位置到鼠标当前位置，防止瞬间碰撞
            player.x = mouse.x;
            player.y = mouse.y;

            isPlaying = true;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            initStars();
            animate();
        }

        function gameOver() {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            
            // 保存最高分
            if(score > highScore) {
                highScore = score;
                localStorage.setItem('neon_dodge_highscore', highScore);
                highScoreEl.innerText = highScore;
            }

            finalScoreEl.innerText = score;
            gameOverScreen.classList.remove('hidden');
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        
        // 初始背景效果（不玩游戏时也有星星动）
        function idleAnimate() {
            if(isPlaying) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if(stars.length === 0) initStars();
            
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(idleAnimate);
        }
        idleAnimate();

    </script>
</body>
</html>
