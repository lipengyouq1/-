<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>霓虹打砖块 - Neon Breakout</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111827; /* 深灰背景 */
            font-family: 'Arial', sans-serif;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            border: 2px solid #334155;
            background-color: #0f172a;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .message-box {
            background: rgba(15, 23, 42, 0.9);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #3b82f6;
            text-align: center;
            pointer-events: auto;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
            display: none; /* 默认隐藏 */
        }
        h1 {
            color: #60a5fa;
            margin: 0 0 10px 0;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #94a3b8;
            margin: 0 0 20px 0;
            font-size: 1.1rem;
        }
        button {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            padding: 12px 30px;
            color: white;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="score-board">分数: <span id="score">0</span></div>

    <div id="ui-layer">
        <div id="start-screen" class="message-box" style="display: block;">
            <h1>霓虹打砖块</h1>
            <p>拖动挡板，不要让球掉落</p>
            <button onclick="startGame()">开始游戏</button>
        </div>
        <div id="game-over-screen" class="message-box">
            <h1 id="end-title" style="color: #ef4444;">游戏结束</h1>
            <p>最终得分: <span id="final-score">0</span></p>
            <button onclick="startGame()">再玩一次</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let animationId;
        let score = 0;
        let isPlaying = false;

        // 适配移动端和桌面端的画布大小
        function resize() {
            // 限制最大宽度，防止在大屏幕上太宽难玩
            const maxWidth = 600; 
            const width = Math.min(window.innerWidth, maxWidth);
            const height = window.innerHeight;
            
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // 游戏对象参数
        const paddleProps = { height: 15, width: 100, color: '#38bdf8', yOffset: 50 };
        const ballProps = { radius: 8, speed: 5, color: '#f472b6' };
        const brickProps = { rowCount: 5, columnCount: 6, padding: 10, offsetTop: 60, offsetLeft: 35, height: 25, color: '#a78bfa' };

        let paddle = { x: canvas.width / 2 - 50 };
        let ball = { x: canvas.width / 2, y: canvas.height - 30, dx: 3, dy: -3 };
        let bricks = [];

        // 初始化砖块
        function initBricks() {
            bricks = [];
            // 根据屏幕宽度动态计算列数
            const cols = Math.floor((canvas.width - 20) / (60 + 10)); // 60是大概的砖块宽
            const actualBrickWidth = (canvas.width - 40 - (cols - 1) * 10) / cols;
            
            for(let c=0; c<cols; c++) {
                bricks[c] = [];
                for(let r=0; r<brickProps.rowCount; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1, width: actualBrickWidth };
                }
            }
            return { cols, actualBrickWidth };
        }

        let brickConfig = initBricks();

        // 监听鼠标和触摸
        function movePaddle(clientX) {
            let relativeX = clientX - canvas.offsetLeft;
            // 确保挡板在画布内
            if(relativeX > 0 && relativeX < canvas.width) {
                paddle.x = relativeX - paddleProps.width / 2;
            }
        }

        document.addEventListener("mousemove", (e) => {
            if(isPlaying) movePaddle(e.clientX);
        });

        document.addEventListener("touchmove", (e) => {
            if(isPlaying) {
                e.preventDefault(); // 防止滚动
                movePaddle(e.touches[0].clientX);
            }
        }, { passive: false });

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ballProps.radius, 0, Math.PI*2);
            ctx.fillStyle = ballProps.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = ballProps.color;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddle.x, canvas.height - paddleProps.yOffset, paddleProps.width, paddleProps.height);
            ctx.fillStyle = paddleProps.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = paddleProps.color;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.closePath();
        }

        function drawBricks() {
            for(let c=0; c<brickConfig.cols; c++) {
                for(let r=0; r<brickProps.rowCount; r++) {
                    if(bricks[c][r].status === 1) {
                        const brickX = 20 + (c * (bricks[c][r].width + 10));
                        const brickY = (r * (brickProps.height + 10)) + brickProps.offsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, bricks[c][r].width, brickProps.height);
                        ctx.fillStyle = `hsl(${r * 40}, 70%, 60%)`; // 彩色砖块
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function collisionDetection() {
            let activeBricks = 0;
            for(let c=0; c<brickConfig.cols; c++) {
                for(let r=0; r<brickProps.rowCount; r++) {
                    const b = bricks[c][r];
                    if(b.status === 1) {
                        activeBricks++;
                        if(ball.x > b.x && ball.x < b.x + b.width && ball.y > b.y && ball.y < b.y + brickProps.height) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10;
                            document.getElementById('score').innerText = score;
                            // 稍微加速
                            if(ball.speed < 10) ball.speed += 0.1;
                        }
                    }
                }
            }
            if(activeBricks === 0) {
                gameOver(true);
            }
        }

        function draw() {
            if(!isPlaying) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            // 墙壁碰撞
            if(ball.x + ball.dx > canvas.width - ballProps.radius || ball.x + ball.dx < ballProps.radius) {
                ball.dx = -ball.dx;
            }
            if(ball.y + ball.dy < ballProps.radius) {
                ball.dy = -ball.dy;
            } else if(ball.y + ball.dy > canvas.height - ballProps.radius) {
                // 掉到底部
                if(ball.x > paddle.x && ball.x < paddle.x + paddleProps.width && ball.y + ball.dy > canvas.height - paddleProps.yOffset - ballProps.radius) {
                    // 碰到挡板
                    ball.dy = -ball.speed; 
                    // 根据击打位置改变X方向速度（让球更有趣）
                    const hitPoint = ball.x - (paddle.x + paddleProps.width / 2);
                    ball.dx = hitPoint * 0.15;
                } else if (ball.y > canvas.height) {
                    gameOver(false);
                    return;
                }
            }

            ball.x += ball.dx;
            ball.y += ball.dy;

            animationId = requestAnimationFrame(draw);
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            
            score = 0;
            document.getElementById('score').innerText = score;
            
            // 重置球和挡板
            ball = { x: canvas.width / 2, y: canvas.height - 60, dx: 3, dy: -3, speed: 4 };
            paddle = { x: canvas.width / 2 - paddleProps.width / 2 };
            brickConfig = initBricks();
            
            isPlaying = true;
            draw();
        }

        function gameOver(win) {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            const title = document.getElementById('end-title');
            if(win) {
                title.innerText = "你赢了！🎉";
                title.style.color = "#4ade80";
            } else {
                title.innerText = "游戏结束";
                title.style.color = "#ef4444";
            }
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').style.display = 'block';
        }

        // 初始绘制一次背景
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0,0,canvas.width, canvas.height);

    </script>
</body>
</html>
